replicaCount: 1


serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "notebook"

image:
  repository: agilesolutions/notebook
  tag: 1.0.0
  pullPolicy: IfNotPresent

imagePullSecrets:
  name: dockerhub-secret

app:
  enabled: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: traefik
  host: notbook.agilesolutions.com
  clusterIssuer: letsencrypt-production
  tlsSecretName: notebook-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  SPRING_PROFILES_ACTIVE: kubernetes
  LOG_LEVEL: INFO