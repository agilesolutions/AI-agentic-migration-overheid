spring:

  application:
    name: notebook

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://notebook-postgresql.database.svc.cluster.local:5432/notebook}
    username: ${SPRING_DATASOURCE_USERNAME:notebook}
    password: ${SPRING_DATASOURCE_PASSWORD:notebook}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true  # Necessary if the database already has tables
    locations:
      - classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG