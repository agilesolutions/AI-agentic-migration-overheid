plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.cloud.tools.jib' version '3.4.5'
	id 'org.openapi.generator' version '7.25.0'
	id 'jacoco'
}

group = 'com.agilesolutions.notebook'
version = '1.0.15'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

ext {
	commit = commit()
	branchName = branchName()
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { url = 'https://repo.spring.io/milestone' }
	maven { url = 'https://repo.spring.io/snapshot' }
	maven { url = uri("https://repo.embabel.com/artifactory/libs-snapshot") }
}

dependencies {
	implementation libs.spring.web
	implementation libs.spring.webmvc
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation libs.spring.data.validation
	implementation 'org.springframework:spring-tx:7.0.9'
	implementation libs.spring.doc.api
	implementation libs.spring.doc.ui
	implementation libs.lombok
	annotationProcessor libs.lombok

	runtimeOnly 'org.postgresql:postgresql'
	implementation libs.spring.flyway
	implementation libs.flyway.pg

	// observability
	implementation libs.otlp.appender
	implementation libs.spring.otlp

	testImplementation libs.spring.otlp.test
	testImplementation libs.spring.web.test
	testImplementation libs.spring.boot.test
	testImplementation libs.spring.restclient.test
	testImplementation libs.spring.test.containers
	testImplementation libs.jupiter.test.containers
	// Additional test libraries from version catalog
	// Testcontainers JUnit and PostgreSQL support are provided via the catalog entries
	testImplementation libs.jupiter.test.containers
	testImplementation libs.postgresql.test.containers
	// In-memory DB for repository slice tests
	testImplementation libs.h2
	// Flyway core on test classpath so migrations can be executed against test DB
	testImplementation libs.flyway.core

	// Explicit Spring test starter provides test slice support (WebMvcTest, MockBean, Data JPA test helpers etc.)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Ensure test autoconfigure/artifacts are directly available to test compile
	testImplementation 'org.springframework.boot:spring-boot-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
}

String commit() {
	return 'git rev-parse HEAD'.execute().text.trim()
}

String branchName() {
	return hasProperty('branch.name') ? property('branch.name') : 'git branch --show-current'.execute().text.trim()
}

bootJar {

	archiveFileName = './application.jar'

	manifest{
		attributes(
				'Built-by'          : System.properties['user.name'],
				'Build-Timestamp'   : java.time.Instant.now(),
				'Build-Revision'    : commit,
				'Build-Branch'      : branchName,
				'Created-by'        : "Gradle ${gradle.gradleVersion}",
				'Build-JDK'         : "${System.properties['java.version']} ${System.properties['java.vendor']} ${System.properties['java.vm.version']}",
				'Build-OS'          : "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"
		)

	}

}

tasks.register('release', GradleBuild) {
	tasks = ['clean', 'build', 'jib']
}

test {
	useJUnitPlatform()
	enabled = true
	// Exclude integration tests (named *IT) from the default unit test task
	exclude '**/*IT.class'
	testLogging {
		events "passed", "skipped", "failed"
	}
}

// Separate integrationTest task for Testcontainers-based tests (classes ending with IT)
import org.gradle.api.tasks.testing.logging.TestLogEvent

tasks.register('integrationTest', Test) {
	useJUnitPlatform()
	description = 'Runs integration tests that require containers or external resources.'
	group = 'verification'

	// include only *IT tests
	include '**/*IT.class'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	testLogging {
		events TestLogEvent.FAILED, TestLogEvent.PASSED, TestLogEvent.SKIPPED
		showStandardStreams = true
	}

	// Integration tests may be slower; increase timeout or fork if needed
	jvmArgs = ['-Xmx1g']
}

// Make 'check' depend on integrationTest so CI can run both when desired; keep optional by running only 'test' locally
check.dependsOn(tasks.named('integrationTest'))

def openApiGeneratedDir =
		layout.buildDirectory
				.dir("generated/openapi")
				.get()
				.asFile

openApiGenerate {
	generatorName = "spring"
	inputSpec = "$rootDir/openapi/notebook-api.yaml"
	outputDir = openApiGeneratedDir.absolutePath
	apiPackage = "com.agilesolutions.openshift.api"
	modelPackage = "com.agilesolutions.openshift.api.model"
	invokerPackage = "com.agilesolutions.openshift.api.invoker"
	configOptions = [
			library                     : "spring-boot",
			useSpringBoot4              : "true",
			useJakartaEe                : "true",
			useJackson3                 : "true",
			interfaceOnly               : "true",
			useResponseEntity           : "true",
			useSpringController         : "false",
			useTags                     : "true",
			useBeanValidation           : "true",
			useSpringBuiltInValidation : "true",
			openApiNullable             : "false",
			dateLibrary                 : "java8",
			hideGenerationTimestamp     : "true",
			skipDefaultInterface        : "true",
			generatedConstructorWithRequiredArgs: "true"
	]

	globalProperties = [
			apis            : "",
			models          : "",
			supportingFiles : "false"
	]
}

sourceSets {
	main {
		java {
			srcDir "$buildDir/generated/openapi/src/main/java"
		}
	}
}

jib {

	from {
		// Uses an optimal, distroless Java 25 image as the base
		image = "eclipse-temurin:25-jre"
	}

	to {
		image = System.getenv('DOCKERHUB_REGISTRY') + "/notebook:${version}"
		// Optional: Specify credentials if using a private registry
		auth {
			username = System.getenv("DOCKERHUB_USERNAME") ?: ""
			password = System.getenv("DOCKERHUB_PASSWORD") ?: ""
		}
	}
	container {
		// Container runtime configuration
		ports = ['8080']
		jvmFlags = [
				'-Xms256m',
				'-Xmx512m',
				'-XX:+UseG1GC',
				'-Djava.security.egd=file:/dev/./urandom'
		]
		// Set the main class explicitly
		mainClass = 'com.agilesolutions.openshift.NotebookApplication'
		// Use current timestamp for image creation time
		creationTime = 'USE_CURRENT_TIMESTAMP'
		// Set the format to OCI
		format = 'OCI'
	}

}

// Load jacoco extra configuration if present
if (file('gradle/jacoco.gradle').exists()) {
    apply from: 'gradle/jacoco.gradle'
}

compileJava {
	dependsOn tasks.openApiGenerate
}

clean {
	delete "$buildDir/generated"
}
