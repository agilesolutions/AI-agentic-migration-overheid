services:

  postgres:
    image: postgres:17
    container_name: notebook-postgres
    environment:
      POSTGRES_DB: notebook
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: notebook
    ports:
      - "5432:5432"
    volumes:
      - notebook-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook -d notebook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notebook-postgres-data: